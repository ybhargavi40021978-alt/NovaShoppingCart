<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="425" rx="130" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <!-- Handle -->
  <path d="M 210 110 C 210 70, 290 70, 290 110" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <g filter="url(#bagShadow)">
    <!-- Main Body -->
    <path d="M 160 160 C 170 100, 330 100, 340 160 L 360 380 C 360 410, 140 410, 140 380 Z" fill="url(#bagGrad)"/>
    <!-- Top Flap / Zipper Line -->
    <path d="M 165 180 C 220 200, 280 200, 335 180" fill="none" stroke="#475569" stroke-width="3"/>
    <!-- Front Pocket -->
    <rect x="180" y="240" width="140" height="130" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Front Pocket Zipper -->
    <line x1="195" y1="260" x2="305" y2="260" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="210" cy="260" r="4" fill="#5b4bdb"/>
    <!-- Logo Patch -->
    <rect x="235" y="300" width="30" height="20" rx="4" fill="#5b4bdb"/>
    <line x1="242" y1="310" x2="258" y2="310" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
