<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Payment Page — NovaCart</title>
  <meta name="description" content="NovaCart Payment Page - Interface #10">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/payment.css">
</head>
<body class="payment-page-body">

  <div class="payment-viewport-wrapper">

    <!-- Page Label: [10] Payment Page -->
    <div class="page-label">
      <span class="page-number">10</span>
      <h1>Payment Page</h1>
    </div>

    <!-- Main Payment Card -->
    <main class="payment-card-container" role="main">

      <h2 class="payment-card-title">Payment Method</h2>

      <form id="paymentMethodForm" class="payment-form" novalidate>

        <!-- 1. Cash on Delivery (Selected in reference) -->
        <div class="method-card-wrapper method-cod selected" id="methodCodWrapper" data-method="cod">
          <label class="method-label" for="methodCod">
            <span class="custom-radio unselected-indicator" aria-hidden="true"></span>
            <span class="method-title">Cash on Delivery</span>
            <span class="custom-radio selected-indicator" aria-hidden="true">
              <span class="radio-inner-dot"></span>
            </span>
          </label>
          <input type="radio" id="methodCod" name="paymentMethod" value="cod" checked class="visually-hidden">
        </div>

        <!-- 2. Card Payment (With card logos underneath) -->
        <div class="method-card-wrapper method-card-payment" id="methodCardWrapper" data-method="card">
          <label class="method-label" for="methodCard">
            <span class="custom-radio unselected-indicator" aria-hidden="true"></span>
            <span class="method-title">Card Payment</span>
          </label>
          <input type="radio" id="methodCard" name="paymentMethod" value="card" class="visually-hidden">

          <div class="card-logos-row" aria-label="Supported Payment Cards">
            <!-- VISA -->
            <div class="card-badge visa-badge" title="Visa">
              <svg viewBox="0 0 44 18" class="card-svg" aria-label="Visa">
                <text x="2" y="14" fill="#1A1F71" font-family="'Inter', sans-serif" font-weight="900" font-size="15" letter-spacing="0.5">VISA</text>
              </svg>
            </div>

            <!-- Mastercard -->
            <div class="card-badge mc-badge" title="Mastercard">
              <svg viewBox="0 0 34 20" class="card-svg" aria-label="Mastercard">
                <circle cx="12" cy="10" r="8" fill="#EB001B" />
                <circle cx="22" cy="10" r="8" fill="#F79E1B" fill-opacity="0.9" />
              </svg>
            </div>

            <!-- Mastercard-style / Generic Card Icon -->
            <div class="card-badge card-icon-badge" title="Payment Card">
              <svg viewBox="0 0 32 20" class="card-svg" aria-hidden="true">
                <rect x="1" y="2" width="30" height="16" rx="2.5" fill="#3D4465" />
                <rect x="1" y="5" width="30" height="3.5" fill="#1C2138" />
                <rect x="4" y="12" width="5" height="2.5" rx="0.8" fill="#FFD700" />
              </svg>
            </div>

            <!-- RuPay -->
            <div class="card-badge rupay-badge" title="RuPay">
              <svg viewBox="0 0 52 18" class="card-svg" aria-label="RuPay">
                <text x="1" y="13.5" fill="#132B5B" font-family="'Inter', sans-serif" font-weight="800" font-size="12">Ru</text>
                <text x="19" y="13.5" fill="#28A745" font-family="'Inter', sans-serif" font-weight="800" font-size="12">Pay</text>
                <polygon points="43,5 47,9.5 43,14" fill="#F37023" />
                <polygon points="47,5 51,9.5 47,14" fill="#097938" />
              </svg>
            </div>

            <!-- Amex -->
            <div class="card-badge amex-badge" title="American Express">
              <svg viewBox="0 0 42 18" class="card-svg" aria-label="Amex">
                <rect width="42" height="18" rx="2.5" fill="#2E77BB" />
                <text x="3.5" y="13.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" letter-spacing="0.5">AMEX</text>
              </svg>
            </div>
          </div>
        </div>

        <!-- 3. UPI (With UPI brand marks underneath) -->
        <div class="method-card-wrapper method-upi" id="methodUpiWrapper" data-method="upi">
          <label class="method-label" for="methodUpi">
            <span class="custom-radio unselected-indicator" aria-hidden="true"></span>
            <span class="method-title">UPI</span>
          </label>
          <input type="radio" id="methodUpi" name="paymentMethod" value="upi" class="visually-hidden">

          <div class="upi-logos-row" aria-label="Supported UPI Apps">
            <!-- Google Pay / GPay -->
            <div class="upi-badge gpay-badge" title="Google Pay">
              <svg viewBox="0 0 46 22" class="upi-svg" aria-label="Google Pay">
                <rect width="46" height="22" rx="3.5" fill="#FFFFFF" stroke="#E1E5F0" stroke-width="1" />
                <path d="M13 11c0-.3 0-.7-.1-1H8v2h2.8c-.1.7-.6 1.4-1.3 1.8v1.4h2c1.2-1.1 1.8-2.6 1.8-4.2z" fill="#4285F4"/>
                <path d="M8 16c1.3 0 2.5-.4 3.3-1.2l-2-1.4c-.4.3-.9.5-1.5.5-1.2 0-2.2-.8-2.6-1.8H3.2v1.5C4 14.9 5.8 16 8 16z" fill="#34A853"/>
                <path d="M5.4 12.1c-.2-.5-.2-1.1 0-1.6V9H3.2c-.7 1.4-.7 3.1 0 4.5l2.2-1.4z" fill="#FBBC05"/>
                <path d="M8 7.2c.7 0 1.4.3 1.9.7l1.4-1.4C10.4 5.7 9.2 5.2 8 5.2 5.8 5.2 4 6.3 3.2 7.7l2.2 1.5C5.8 8.1 6.8 7.2 8 7.2z" fill="#EA4335"/>
                <text x="16" y="15" fill="#5F6368" font-family="'Inter', sans-serif" font-weight="700" font-size="10">Pay</text>
              </svg>
            </div>

            <!-- PhonePe -->
            <div class="upi-badge phonepe-badge" title="PhonePe">
              <svg viewBox="0 0 50 22" class="upi-svg" aria-label="PhonePe">
                <rect width="50" height="22" rx="3.5" fill="#5F259F" />
                <circle cx="11" cy="11" r="6" fill="#FFFFFF" />
                <text x="8.5" y="14.5" fill="#5F259F" font-family="'Inter', sans-serif" font-weight="900" font-size="10.5">पे</text>
                <text x="21" y="14.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="9">PhonePe</text>
              </svg>
            </div>

            <!-- Paytm / UPI -->
            <div class="upi-badge paytm-badge" title="Paytm">
              <svg viewBox="0 0 48 22" class="upi-svg" aria-label="Paytm">
                <rect width="48" height="22" rx="3.5" fill="#FFFFFF" stroke="#E1E5F0" stroke-width="1" />
                <text x="5" y="15" fill="#002E6E" font-family="'Inter', sans-serif" font-weight="900" font-size="10">Pay</text>
                <text x="24" y="15" fill="#00BAF2" font-family="'Inter', sans-serif" font-weight="900" font-size="10">tm</text>
              </svg>
            </div>
          </div>
        </div>

        <!-- 4. Demo Payment Container (With Continue to Order button) -->
        <div class="demo-payment-section" id="methodDemoWrapper" data-method="demo">
          <label class="method-label demo-label" for="methodDemo">
            <span class="custom-radio unselected-indicator" aria-hidden="true"></span>
            <span class="method-title">Demo Payment</span>
          </label>
          <input type="radio" id="methodDemo" name="paymentMethod" value="demo" class="visually-hidden">

          <!-- Continue to Order → Button -->
          <button type="submit" class="continue-order-btn" id="btnContinueOrder">
            <span class="btn-spinner" id="btnSpinner" aria-hidden="true"></span>
            <span class="btn-text" id="btnText">Continue to Order &rarr;</span>
          </button>

          <!-- Inline Error Box -->
          <div class="payment-inline-error" id="paymentErrorBox" role="alert" style="display: none;"></div>
        </div>

      </form>

    </main>

  </div>

  <script src="js/api-client.js"></script>

  <script src="js/payment.js"></script>
</body>
</html>
