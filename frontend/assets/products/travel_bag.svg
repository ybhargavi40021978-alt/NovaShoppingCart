<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="travelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="travelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="425" rx="160" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <!-- Handles -->
  <path d="M 180 180 C 180 100, 320 100, 320 180" fill="none" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
  <!-- Main Duffle Body -->
  <g filter="url(#travelShadow)">
    <rect x="100" y="180" width="300" height="200" rx="40" fill="url(#travelGrad)"/>
    <!-- Leather Accent Straps -->
    <rect x="175" y="180" width="22" height="200" fill="#d97706"/>
    <rect x="303" y="180" width="22" height="200" fill="#d97706"/>
    <!-- Zipper line -->
    <line x1="120" y1="210" x2="380" y2="210" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="250" cy="210" r="6" fill="#f59e0b"/>
    <!-- Front pocket -->
    <rect x="210" y="250" width="80" height="70" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="235" y="275" width="30" height="18" rx="4" fill="#5b4bdb"/>
  </g>
</svg>
