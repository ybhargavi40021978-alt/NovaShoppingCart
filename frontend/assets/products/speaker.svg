<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="speakerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="420" rx="110" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <!-- Cylinder Speaker -->
  <g filter="url(#speakerShadow)">
    <rect x="180" y="110" width="140" height="280" rx="50" fill="url(#speakerGrad)"/>
    <!-- Speaker Grille Mesh Dots/Lines -->
    <path d="M 210 180 L 290 180 M 205 200 L 295 200 M 200 220 L 300 220 M 200 240 L 300 240 M 200 260 L 300 260 M 205 280 L 295 280 M 210 300 L 290 300" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <!-- Volume buttons on top -->
    <circle cx="230" cy="140" r="10" fill="#ffffff" opacity="0.8"/>
    <path d="M 224 140 L 236 140" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="270" cy="140" r="10" fill="#ffffff" opacity="0.8"/>
    <path d="M 264 140 L 276 140 M 270 134 L 270 146" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hanging cord -->
    <path d="M 250 110 C 250 70, 290 60, 310 90" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
