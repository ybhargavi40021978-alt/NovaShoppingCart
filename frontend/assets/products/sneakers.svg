<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shoeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shoeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="400" rx="170" ry="18" fill="#cbd5e1" opacity="0.6"/>
  <g filter="url(#shoeShadow)">
    <!-- Sole -->
    <path d="M 90 340 C 130 345, 380 345, 420 330 C 425 350, 410 365, 380 365 C 260 365, 120 370, 80 360 C 70 348, 80 340, 90 340 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 80 360 C 120 370, 260 365, 380 365 C 410 365, 425 350, 420 330 L 422 342 C 420 365, 390 375, 370 375 L 100 375 C 80 375, 75 365, 80 360 Z" fill="#e2e8f0"/>
    <!-- Upper Body -->
    <path d="M 100 340 C 90 300, 110 240, 150 200 C 180 170, 210 210, 240 240 C 290 260, 360 280, 410 310 C 420 320, 420 330, 410 335 C 380 345, 130 345, 100 340 Z" fill="url(#shoeRed)"/>
    <!-- Collar & Tongue -->
    <path d="M 150 200 C 165 170, 200 175, 215 210 C 185 220, 160 215, 150 200 Z" fill="#1e293b"/>
    <!-- Laces / Details -->
    <path d="M 190 220 L 220 235 M 205 240 L 235 255 M 225 260 L 255 275" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Swoosh/Decal -->
    <path d="M 160 310 Q 240 310, 310 270 Q 250 330, 170 325 Z" fill="#ffffff"/>
  </g>
</svg>
