<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="430" rx="120" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <g filter="url(#phoneShadow)">
    <rect x="160" y="70" width="180" height="340" rx="36" fill="url(#phoneBody)"/>
    <rect x="168" y="78" width="164" height="324" rx="28" fill="url(#screenWall)"/>
    <!-- Dynamic Island / Punch hole -->
    <rect x="225" y="88" width="50" height="14" rx="7" fill="#0f172a"/>
    <!-- Lock screen clock -->
    <text x="250" y="160" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">09:41</text>
    <text x="250" y="185" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" text-anchor="middle">Wednesday, Sep 12</text>
    <!-- Wallpaper artwork -->
    <circle cx="210" cy="270" r="40" fill="#ffffff" opacity="0.15"/>
    <circle cx="280" cy="320" r="50" fill="#ffffff" opacity="0.12"/>
    <!-- Home bar -->
    <rect x="215" y="385" width="70" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
