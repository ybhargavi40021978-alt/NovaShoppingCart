<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="mouseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="420" rx="100" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <!-- Mouse Silhouette -->
  <g filter="url(#mouseShadow)">
    <path d="M 180 200 C 180 120, 220 80, 250 80 C 280 80, 320 120, 320 200 C 320 300, 310 390, 250 390 C 190 390, 180 300, 180 200 Z" fill="url(#mouseBody)"/>
    <!-- Scroll Wheel -->
    <rect x="242" y="120" width="16" height="42" rx="8" fill="#5b4bdb"/>
    <line x1="242" y1="135" x2="258" y2="135" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="242" y1="145" x2="258" y2="145" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Button separation line -->
    <line x1="250" y1="162" x2="250" y2="240" stroke="#334155" stroke-width="2"/>
    <!-- RGB Accent Lines -->
    <path d="M 210 260 C 210 330, 230 360, 250 360 C 270 360, 290 330, 290 260" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="250" cy="320" r="8" fill="#6366f1" opacity="0.8"/>
  </g>
</svg>
