<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="earbudCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="earbudHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="budShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="410" rx="140" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <!-- Charging Case -->
  <g filter="url(#budShadow)">
    <rect x="170" y="210" width="160" height="180" rx="55" fill="url(#earbudCase)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Lid Seam -->
    <path d="M 170 270 L 330 270" stroke="#94a3b8" stroke-width="2"/>
    <!-- LED Indicator -->
    <circle cx="250" cy="300" r="4" fill="#22c55e"/>
  </g>
  <!-- Left Earbud popping out -->
  <g filter="url(#budShadow)" transform="rotate(-15 150 160)">
    <circle cx="150" cy="140" r="26" fill="url(#earbudHead)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="142" y="150" width="16" height="50" rx="8" fill="url(#earbudHead)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="158" cy="138" r="8" fill="#1e293b"/>
  </g>
  <!-- Right Earbud popping out -->
  <g filter="url(#budShadow)" transform="rotate(15 350 160)">
    <circle cx="350" cy="140" r="26" fill="url(#earbudHead)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="342" y="150" width="16" height="50" rx="8" fill="url(#earbudHead)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="342" cy="138" r="8" fill="#1e293b"/>
  </g>
</svg>
