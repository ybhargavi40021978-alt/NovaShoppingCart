<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="watchBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="watchBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b4bdb"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="440" rx="110" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <!-- Top Band -->
  <path d="M 200 60 L 300 60 L 290 170 L 210 170 Z" fill="url(#watchBand)"/>
  <!-- Bottom Band -->
  <path d="M 210 330 L 290 330 L 300 440 L 200 440 Z" fill="url(#watchBand)"/>
  <!-- Watch Body -->
  <rect x="170" y="160" width="160" height="180" rx="42" fill="url(#watchBody)" filter="url(#watchShadow)"/>
  <!-- Crown / Button -->
  <rect x="330" y="210" width="10" height="36" rx="4" fill="#64748b"/>
  <!-- Screen -->
  <rect x="182" y="172" width="136" height="156" rx="32" fill="url(#screenGrad)"/>
  <!-- Screen Display -->
  <text x="250" y="235" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">10:42</text>
  <text x="250" y="260" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">MON, 12 OCT</text>
  <circle cx="215" cy="290" r="14" fill="#ffffff" opacity="0.15"/>
  <path d="M 210 290 L 220 290 M 215 285 L 215 295" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="285" cy="290" r="14" fill="#ffffff" opacity="0.15"/>
  <path d="M 280 294 C 280 294, 283 286, 286 288 C 289 290, 292 284, 292 284" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
