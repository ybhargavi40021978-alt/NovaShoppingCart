    <!-- Folded Ear Cup 1 -->
    <ellipse cx="205" cy="290" rx="55" ry="75" fill="url(#hp4Grad)" transform="rotate(35 205 290)"/>
    <ellipse cx="205" cy="290" rx="38" ry="55" fill="#475569" transform="rotate(35 205 290)"/>
    <circle cx="205" cy="290" r="14" fill="#5b4bdb"/>
    <!-- Folded Ear Cup 2 -->
