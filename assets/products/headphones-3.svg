<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hp3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="softSh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="425" rx="140" ry="18" fill="#cbd5e1" opacity="0.6"/>
  <!-- Side Profile View -->
  <g filter="url(#softSh3)">
    <!-- Arch Band side view -->
    <path d="M 180 320 C 180 120, 270 90, 310 140" fill="none" stroke="url(#hp3Grad)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 195 280 C 195 140, 265 110, 300 150" fill="none" stroke="#5b4bdb" stroke-width="10" stroke-linecap="round"/>
    <!-- Side Outer Ear Cup -->
    <ellipse cx="210" cy="310" rx="75" ry="95" fill="url(#hp3Grad)"/>
    <ellipse cx="210" cy="310" rx="58" ry="76" fill="#334155"/>
    <circle cx="210" cy="310" r="24" fill="#5b4bdb"/>
    <!-- Power/ANC button indicators -->
    <circle cx="210" cy="385" r="4" fill="#22c55e"/>
    <circle cx="230" cy="382" r="4" fill="#cbd5e1"/>
  </g>
</svg>
